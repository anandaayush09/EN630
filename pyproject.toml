[project]
name = "en630"
version = "0.1.0"
description = "Scheffler-dish solar steam for hostel cooking: data, models and analysis (EN 630, Group 05)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aayush M Anand" }]
requires-python = ">=3.11"
# pvlib: solar position and the PVGIS client; pandera: weather table validation; SALib: Sobol
# indices; pyyaml: the inputs files; seaborn and matplotlib: figures.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pvlib>=0.11",       # reference solar-position and irradiance routines + PVGIS client
    "pandera>=0.20",     # declarative validation of weather tables
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "salib>=1.6.0",
]

[dependency-groups]
app = [
    "streamlit>=1.67.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ipykernel>=6",
    "nbformat>=5",
    "nbconvert>=7",
    "nbmake>=1.5",
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "pandas-stubs>=3.1.0.261029",
    "types-pyyaml>=6.0.12.20261111",
    "hypothesis>=6.170.15",
]

[project.scripts]
en630 = "en630.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/en630"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# pandas and pvlib are only partly typed, so their false positives are kept visible as warnings
# instead of being hidden or failing the build.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportIndexIssue = "warning"
reportGeneralTypeIssues = "warning"
